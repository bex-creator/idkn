<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Qwen AI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 15px; }
    #chat-box { height: 350px; border: 1px solid #ccc; border-radius: 8px; padding: 12px; overflow-y: auto; background: #fafafa; }
    .msg { margin-bottom: 12px; line-height: 1.4; }
    .user { color: #0056b3; font-weight: bold; }
    .bot { color: #1e7e34; font-weight: bold; }
    textarea { width: 100%; height: 60px; margin-top: 10px; border-radius: 6px; padding: 8px; box-sizing: border-box; }
    button { padding: 10px 20px; margin-top: 8px; background-color: #0056b3; color: white; border: none; border-radius: 6px; cursor: pointer; }
    button:disabled { background-color: #cccccc; cursor: not-allowed; }
    #status { margin-bottom: 10px; font-size: 0.9em; color: #555; }
  </style>
</head>
<body>

  <h2>Local Qwen AI (4GB Chromebook Edition)</h2>
  <div id="status">Status: Initializing engine...</div>
  <div id="chat-box"></div>

  <textarea id="prompt" placeholder="Ask Qwen something..."></textarea>
  <button id="send-btn" disabled>Send</button>

  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    // 0.5B quantized model fits safely within a 4GB RAM budget
    const selectedModel = "Qwen2.5-0.5B-Instruct-q4f16_1-MLC";
    
    const statusDiv = document.getElementById("status");
    const chatBox = document.getElementById("chat-box");
    const promptInput = document.getElementById("prompt");
    const sendBtn = document.getElementById("send-btn");

    let engine;

    async function init() {
      try {
        engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (progress) => {
            statusDiv.innerText = `Loading Model: ${progress.text}`;
          }
        });
        statusDiv.innerText = "Status: Qwen is ready! Running 100% locally in browser.";
        sendBtn.disabled = false;
      } catch (err) {
        statusDiv.innerText = `WebGPU Error: Your Chromebook GPU might not support WebGPU. (${err.message})`;
      }
    }

    sendBtn.addEventListener("click", async () => {
      const userText = promptInput.value.trim();
      if (!userText) return;

      promptInput.value = "";
      sendBtn.disabled = true;

      chatBox.innerHTML += `<div class="msg"><span class="user">You:</span> ${userText}</div>`;
      
      const botDiv = document.createElement("div");
      botDiv.className = "msg";
      botDiv.innerHTML = `<span class="bot">Qwen:</span> Thinking...`;
      chatBox.appendChild(botDiv);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const completion = await engine.chat.completions.create({
          messages: [{ role: "user", content: userText }],
          stream: true,
        });

        let reply = "";
        for await (const chunk of completion) {
          reply += chunk.choices[0]?.delta?.content || "";
          botDiv.innerHTML = `<span class="bot">Qwen:</span> ${reply}`;
          chatBox.scrollTop = chatBox.scrollHeight;
        }
      } catch (e) {
        botDiv.innerHTML = `<span class="bot">Qwen:</span> Error: ${e.message}`;
      }

      sendBtn.disabled = false;
    });

    init();
  </script>
</body>
</html>
